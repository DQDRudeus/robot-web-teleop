# One-time source import: no device connections and no stored personal credentials.
name: Import verified sanitized source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-sanitized-source.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify archive and commit public source files
        shell: python
        env:
          IMPORT_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, io, json, os, urllib.request, zipfile
          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'DQDRudeus/robot-web-teleop':
              raise SystemExit('This source importer is restricted to its original repository.')
          token = os.environ['IMPORT_TOKEN']
          def api(method, path, body=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + '/' + path,
                  data=None if body is None else json.dumps(body).encode('utf-8'),
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
                  method=method)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          workflow = api('GET', 'contents/.github/workflows/import-sanitized-source.yml?ref=' + os.environ['GITHUB_SHA'])
          document = base64.b64decode(workflow['content']).decode('utf-8')
          encoded = document.split('# PUBLIC_SOURCE_ARCHIVE_BEGIN\n', 1)[1].split('# PUBLIC_SOURCE_ARCHIVE_END', 1)[0]
          archive = base64.b64decode(''.join(line[2:] for line in encoded.splitlines() if line.startswith('#|')), validate=True)
          if hashlib.sha256(archive).hexdigest() != '706ea5c4d9d3890a85e0abb3a2a21bea9c2d228b3ccc1cdaa5b4796c242a1884':
              raise SystemExit('Source archive checksum mismatch.')
          expected = {'.gitignore': 'fa58923c2169cb46e294d44e085dcce0e60844bf0bb222282065c8afdea1963c', 'LICENSE': '7e657d93106224b76e1f1075f3cdfcd89bf67cb182a355648e7361109c1b4a9d', 'README.md': '3c7adfd3ac5bdc526ca51d6f332208d2b4770f056c6ac7300cbc43405dfeba6f', 'backend/am3008_worker.py': 'b2957672c5b217186d51485f201f5ef6fdd6d3313f25fd08513aa48b58bc086e', 'backend/app.py': 'd7d4279f562e0b849d5a1b2b21dc160d517abbd3c9cc6f5d60dfaefa4062cf1f', 'backend/sdk_encoder.py': 'b3997a40c6c6c85b91497c82a7aa44fcad98e7228e2267a84092e574e3635fab', 'backend/turtle_bridge.py': 'dad799deba514504c2cfb0a9fba5eb113386e3e744d7acc94b772bf2d9263ec2', 'backend/turtle_worker.py': 'bcbbac3c6259123f1780307238a4fd154dbe6326725ac259f48d3586ab0ebb43', 'backend/video_quality.py': '24ef5d3b87b59ae185f7eff5575304a1ec4f41e22fccf4305a544148e81e87f3', 'cpp/Makefile': '806dca6b06c3e90f083f50c9c9cd86f778738eb2c3322dc5ad2649fbcd6de163', 'cpp/hik_camera_daemon.cpp': '3d29d716af533509e455ee8cf746b9b156f4f9ec3882d4c53bbd4c1ebf664783', 'cpp/hik_encoder.cpp': '0334db9928a366cd5fcd4c514e1f9f641f84ad1d8409542db3353ae1e984f1e0', 'deploy/assets/hkcamera-control.svg': '19c9ab3080ee331fb4e897f42dff241cc2843a35b6bb2a3d414408bec9d4d969', 'deploy/desktop_launcher.py': 'f697dbdbaf565a8a958395b7df5a8cdcb845224a65f72014dc4b98db254df734', 'deploy/motion_runtime.py': '7bd3f75a850be34da88a9d66b67ab8c7aa4f17c357239fd0d62f2801a9b64109', 'deploy/release_identity.py': 'cef68e173f7912ae933dfb73b9b6829304d7d7993ab7db5e11f0c5f12d7059f8', 'deploy/repair_camera_ui.py': '481fc082ecb6760676dfd35409dc0091bfd36550a546a839cae298f57108897f', 'deploy/stack.py': '40cf7d32845caa0e33f43c165630dbc60f93e2393eba1005991a922eb861281d', 'deploy/start_am3008_control.py': '61493dfce80b0242f52a538a4dcf877835ba2d7875f586f12603178aae20fc24', 'public-control/gateway_routes.py': '3ec4eb7c7af0511571db892e30f8b03dc2674a44797ba3716b0b8f583257168e', 'requirements-control.txt': 'b1011f087813c09bf033aff3d6c5fb66a4d47be01df51744ecccc834a95cc9b6', 'test_am3008_start.py': '42193ef35e30146a69cd2219443f51d6d901b9d409f6a800340c35f8833adb3e', 'test_camera_repair.py': '26e0c5c3368f3a85aada944032c4e795e747dd85217ac252641ee8ab8d8036ed', 'test_control.py': '3b0f4c3dad292476463dc34bc4f4633706442490e1032e8d323bf4935a0a501f', 'test_desktop_launcher.py': '1251950d427cfd1f7b7327907804eac09d1ec4002bcf440e15fd7d4461c82a85', 'test_motion_deploy.py': '5584d8480133f41681edae82d6a2485146beaaeca37f07795a5ed4f44a55810b', 'test_motion_modes.py': '35c08f5d2c90c2a9954741b6878363651dbf4aca72272ead00f8278a39500394', 'test_public_config.py': 'b0e2a418f000af251b6897b806632965fa2eff1d9a314d62af1621d8ae2507cd', 'test_turtle.py': 'dd0dd57a900d01a4607107f25d8b486195fa6b07d1044888e394595778ebe6ee', 'test_video_quality.py': '8159c3ea2a1cfe7ad057e135c2538a7ec728c9960c53e60989c53a9caa2bff76', 'web/driving-settings.js': 'bd6b253e78ade6a140e775a434e5cf4b616d7bffb28888395ec6107797ef3f09', 'web/index.html': '07ab6c11bd9de174ad0581c607d30d079600b57008dbefddf1929b5185e8696f', 'web/input-controls.js': '14f34445927aebff0578abdb289ac8199649e632f36b163a36ac25fdd4688463', 'web/lucide-LICENSE.txt': '1e7290b35280a048667bbf0ebabac1c7fd52a75300e8b2946ac165715997f2bc', 'web/lucide.min.js': 'c87c31c5b16886c7ecd0e598b03b18bb9fd4d9af0e516ff73892aba83e7845b4'}
          entries = []
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              if len(source.infolist()) != len(expected) or set(source.namelist()) != set(expected):
                  raise SystemExit('Archive file allowlist mismatch.')
              for name in sorted(expected):
                  raw = source.read(name)
                  if hashlib.sha256(raw).hexdigest() != expected[name]:
                      raise SystemExit('Source file checksum mismatch.')
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'content': raw.decode('utf-8')})
          parent = api('GET', 'git/ref/heads/main')['object']['sha']
          base = api('GET', 'git/commits/' + parent)['tree']['sha']
          tree = api('POST', 'git/trees', {'base_tree': base, 'tree': entries})['sha']
          if tree == base:
              print('The 35 verified source files are already present; nothing changed.')
          else:
              commit = api('POST', 'git/commits', {'message': 'Import verified sanitized source snapshot', 'tree': tree, 'parents': [parent]})['sha']
              api('PATCH', 'git/refs/heads/main', {'sha': commit, 'force': False})
              print('Imported 35 allowlisted, checksum-verified source files. Commit: ' + commit)

